project_name: meest-post-polska
aliases: ["Meest Post Polska", "Poland", "PL", "Meest PL"]

client_account_id: 2732587797

primary_conversion_name: "Parcels"

thresholds:
  min_clicks: 2
  min_cost: 20
  # Period-proportional floor for analyze_campaign_performance.py's
  # quadrant classification, expressed as a rate rather than a flat count -
  # 10 Parcels conversions over a 2-week period is a fine, small-but-normal
  # sample; the same 10 over 90 days is a persistently low rate, a real
  # signal of a problem, not "not enough data yet". The script scales this
  # to whatever custom period is selected: floor = round(this rate *
  # period_days / 30), with a hard minimum of 3 (see
  # MIN_QUADRANT_FLOOR_ABSOLUTE in analyze_campaign_performance.py) so a
  # very short period still requires a few real data points. A campaign/
  # cohort under the floor goes to "insufficient data", never dropped or
  # force-classified.
  min_conversions_per_30_days: 10
  # How recently a campaign must have started (relative to the analysis
  # period's end date) to be treated as "new" rather than "stagnant" when
  # it lands in insufficient data - a new campaign below the floor has
  # upside potential worth flagging differently from a long-running one
  # that's simply stayed low-volume.
  new_campaign_window_days: 30
  # tCPA candidacy guidance for analyze_campaign_performance.py - these are
  # adjustable assumptions, NOT hard rules from Google; actual stability
  # requirements vary by account. min conversions/30 days is Google's own
  # general guidance for stable Target CPA performance; the CAC-stability
  # check is this toolkit's own proxy (period-over-comparison CAC swing),
  # since a single two-period comparison can't measure true variance.
  tcpa_min_conversions_per_30_days: 30
  tcpa_cac_stability_pct: 30

# Clusters to skip from campaign-performance quadrant scoring (they still
# appear in raw per-campaign CSV output, just not classified/compared) -
# branded campaigns reflect warm/returning-audience behavior, not
# destination-market performance, so scoring them against destination
# cohorts would be comparing apples to oranges.
exclude_from_scoring: ["brand"]

# Clusters are matched by campaign name, top to bottom, first match wins.
# Patterns are regex (re.search, case-insensitive). Short geo-codes (ua, us,
# uk, de, ger) use (?<![A-Za-z])...(?![A-Za-z]) instead of \b: \b treats "_"
# as a word character, so it fails to match e.g. "ua" inside "ua_pl" — this
# account's campaign names use "_", "/", "|", "[]" as delimiters, not just
# spaces, so a plain \b boundary silently drops real campaigns. Verified
# against a live pull of the account's full campaign history (124 campaigns,
# Search/PMax/Display/Demand Gen, all statuses) on 2026-09-14. Destinations
# with no dedicated cluster here (Czech Republic, Netherlands, Italy, Canada)
# fall to catch-all by design — adding clusters for them is a business-scope
# decision, not a pattern fix, so it's left alone pending an explicit ask.
clusters:
  - name: brand
    match_campaign_name: ["brand"]
    description: >
      Branded terms — audience already aware of Meest as a company,
      not destination-specific. Evaluated separately from destination
      performance since it reflects warm/returning audience behavior.

  - name: PL-UA
    match_campaign_name: ["ukrain", "україн", "(?<![A-Za-z])ua(?![A-Za-z])"]
    # "ukrain" (not "ukraina") catches both the Polish ("Ukraina") and
    # English ("Ukraine") spellings — the old "ukraina"-only pattern let
    # English-spelled campaigns (e.g. "Search-Ukraine") fall through to
    # PL-UK, since "uk" is literally the first two letters of "ukraine".

  - name: PL-US
    match_campaign_name: ["(?<![A-Za-z])usa(?![A-Za-z])", "(?<![A-Za-z])us(?![A-Za-z])"]

  - name: PL-UK
    match_campaign_name: ["(?<![A-Za-z])uk(?![A-Za-z])", "wielka brytania", "united kingdom"]

  - name: PL-DE
    match_campaign_name: ["niem", "german", "(?<![A-Za-z])de(?![A-Za-z])", "(?<![A-Za-z])ger(?![A-Za-z])"]
    # "niem" (not "niemcy"/"niemiec") is the root common to this account's
    # actual spellings, including "Pmax | do Niemec" — its single biggest
    # campaign by spend, which the old "niemcy" pattern never matched at all.
    # "ger" (boundary-anchored) catches a recurring "Promo-GER" naming
    # pattern (5 campaigns) that "german"/"niem"/"de" all miss — found in
    # the 2026-09-14 re-validation against the account's full campaign list.

  - name: krajowe
    match_campaign_name: ["krajow", "domestic"]

  - name: international
    match_campaign_name: "catch-all"   # anything not matched above

# Content-based country/destination detection, run against the search
# *term* text itself (not the campaign it currently lives in) - an
# independent axis from clusters[] above. Feeds analyze_topic_alignment.py's
# mismatch/re-home signal (a term whose content says one country but whose
# campaign says another) and its demand-discovery signal (real query volume
# for a country the account doesn't yet serve at all).
#
# `cluster` links a topic to its corresponding clusters[] entry, for the 4
# "core" destinations already served by a dedicated cluster (US/UK/UA/DE).
# Topics with no `cluster` field are "tracked": countries with real or
# plausible demand but no dedicated campaign/cluster yet - classify_topic()
# reports these as tracked_no_campaign rather than single, and the script's
# re-home suggestion only ever points at a live ENABLED campaign, never at
# a tracked topic.
#
# Same regex conventions as clusters (re.search, case-insensitive). Short
# 2-letter country codes are deliberately NOT used as bare patterns here
# (unlike clusters' campaign-name matching) - free-text search-term content
# in Polish is full of short words/diacritics that a 2-letter code would
# false-positive against (e.g. bare "us" inside "usługa" = "service"), so
# every pattern below is a full country-name root or longer.
#
# Built 2026-09-16 as a first pass - most tracked entries below are 1-3
# starter patterns (Polish + English only) and have NOT yet been checked
# against real search-term data for false positives (a short root colliding
# with an unrelated common word) or missing-language gaps (this account
# also has real Ukrainian, Russian, and mixed-script query volume). That
# verification is still pending for most topics - do not treat this list
# as final.
#
# PL-UA/US/UK/DE/IT/CZ/DK were updated 2026-09-21, porting live-verified
# findings from a separate branch's independent real-data check (its
# author ran a real search-term pull and manually reviewed the
# unclassified/ambiguous output - see CLAUDE.md's Known technical notes
# for specifics). Ported: Russian Cyrillic forms (this account has real
# Russian-language volume alongside Polish/Ukrainian/English - "украин" for
# Ukraine was already here, missing it cost ~150 real unclassified terms
# in that check), richer Polish phrase patterns for US/UK, and a real
# (not speculative) Denmark false-positive: bare "dani[ae]" without word
# boundaries matches inside "nadanie"/"podanie"/"oddanie" (Polish
# shipping-domain words for "dispatch/sending") - fixed with \b anchoring.
# Two of that branch's patterns were deliberately NOT ported despite being
# "live-verified" there: bare boundary-anchored "us" and "uk"
# ((?<![A-Za-z])us(?![A-Za-z]) etc.) both still false-positive on real
# Polish words with a diacritic letter immediately adjacent (confirmed:
# "us" matches inside "usługa" = "service"; "uk" matches inside
# "ukąszenie" = "a bite/sting") - [A-Za-z] doesn't cover Polish diacritics,
# so the boundary check silently treats a diacritic as "not a letter" and
# fails to block the match. Keep avoiding bare 2-letter codes in this
# section entirely, per the original design note below.
#
# Two known collision risks were designed around up front, before the
# 2026-09-21 pass above, rather than left for verification to catch:
#   - Denmark: avoided a bare "dan"/"dani" root for the *standalone* word
#     "dania"/"danie", since that's also the Polish word for "dish/course
#     of food" (nominative "danie", genitive/plural "dania" - identical
#     spelling to the country name in that form). The 2026-09-21 \b fix
#     above only solves the *mid-word* collision (inside "nadanie" etc.);
#     this standalone-word ambiguity is real, distinct, and still
#     unresolved - "duń" (Duński/Dunczyk) remains in the pattern list
#     specifically because it doesn't share this ambiguity. Flag any
#     "dani[aei]"-matched row for a manual look before trusting it blindly
#     until this gets its own real-data check.
#   - Czech Republic: avoided bare "czech", since it's a literal substring
#     of "Niemczech" (locative case of "Niemcy" = Germany, e.g. "wysyłka do
#     Niemczech") - the 2026-09-21 pass replaced the original two-pattern
#     fix with a single more-robust lookbehind (see PL-CZ below) that also
#     excludes Polish diacritics, not just ASCII letters, immediately
#     before "czech".
topic_keywords:
  - name: PL-UA
    cluster: PL-UA
    match: ["ukrain", "україн", "украин"]

  - name: PL-US
    cluster: PL-US
    # "stan\w* zjednoczon" replaces the old bare "stany zjednoczone" phrase
    # with a richer inflection match (stanów/stany zjednoczon-ych/-e), and
    # "do stan\w*" catches the shorter real-query form "paczka do stanów"
    # without "zjednoczonych" - phrase-anchored on purpose, since a bare
    # "stan" root would also match "stan przesyłki" (shipment status), an
    # unrelated but plausible real query in this domain. "сша" is the
    # Russian Cyrillic acronym for USA.
    match: ["stan\\w* zjednoczon", "do stan\\w*", "usa", "united states", "сша"]

  - name: PL-UK
    cluster: PL-UK
    # "wielk\w* brytani" replaces the old bare "wielka brytania" phrase
    # with a richer inflection match (wielkiej brytanii/wielka brytania).
    # "великобритан" is the Russian "Great Britain".
    # "(?<![a-ząćęłńóśźż])uk(?![a-ząćęłńóśźż])" is the 2026-09-21-verified
    # fix for a confirmed material false negative: this account's real
    # search-term text uses plain "uk" heavily (121 unique unclassified
    # terms, ~973 cost / 439 clicks over a 60-day pull, including two real
    # mismatches - "dhl uk to poland" sitting in Search-Etsy, "paczki z uk
    # do polski inpost" sitting in Search-Międzynarodowe - that stayed
    # invisible to the mismatch signal with no PL-UK pattern to match
    # against). A bare \b-boundary "uk" was deliberately left out
    # originally because \b doesn't stop it matching inside a Polish word
    # with a diacritic immediately adjacent (e.g. "usługa"/"ukąszenie" for
    # "us"/"uk" - see the header comment above); this lookaround instead
    # excludes the Polish diacritic range on both sides (same technique as
    # PL-CZ's pattern below), confirmed live to reject "usługa"/"ukąszenie"
    # while still matching "do uk"/"z uk"/"uk to poland" etc. "us" has the
    # same theoretical collision risk but zero observed real-world gap in
    # this account's query mix (Polish/English queries here consistently
    # say "usa", not bare "us") - left as a documented candidate for the
    # same fix if that changes, not applied speculatively.
    match: ["wielk\\w* brytani", "united kingdom", "anglia", "angli", "великобритан",
            "(?<![a-ząćęłńóśźż])uk(?![a-ząćęłńóśźż])"]

  - name: PL-DE
    cluster: PL-DE
    # "герман" is the Russian "Germany". "deutschland" (added 2026-09-21,
    # minor real gap found live: "meest post deutschland" was unclassified
    # since none of the other patterns catch the German-language spelling
    # of the country's own name) covers German-language queries, which
    # "german"/"niemc" alone don't.
    match: ["niemc", "niemiec", "german", "герман", "deutschland"]

  - name: PL-AT   # Austria
    match: ["austri", "wiedeń", "wieden"]

  - name: PL-BE   # Belgium
    match: ["belgi"]

  - name: PL-BG   # Bulgaria
    match: ["bułgari", "bulgari"]

  - name: PL-GR   # Greece
    match: ["grecj", "greece"]

  - name: PL-DK   # Denmark
    # "\bdani[aei]\b" is the 2026-09-21-verified fix: word-boundary-anchored
    # so it no longer matches inside "nadanie"/"podanie"/"oddanie" (Polish
    # for "dispatch/sending" - a real false positive found live), while
    # still catching "Dania"/"Danii"/"Danie" (all common Polish cases of
    # the country name) as standalone words. It does NOT resolve the
    # separate standalone-word ambiguity with "danie"/"dania" (a dish) -
    # see the header comment above - so treat a match on this pattern
    # alone as a hint worth a manual look, not a certainty.
    match: ["duń", "denmark", "kopenhag", "\\bdani[aei]\\b"]

  - name: PL-EE   # Estonia
    match: ["estoni"]

  - name: PL-IE   # Ireland
    match: ["irlandi", "ireland"]

  - name: PL-ES   # Spain
    match: ["hiszpani", "spain"]

  - name: PL-IT   # Italy
    # "итали" is Russian, found live 2026-09-21.
    # Bare "ital" (fixed 2026-09-21) false-positived on "digital" - confirmed
    # live against this account's own Etsy campaigns ("digital products on
    # etsy", "etsy ai digital products", etc., all wrongly tagged PL-IT).
    # Also would have risked "capital"/"hospital"/"vital"/"recital".
    # Lookbehind-anchored so it still matches "ital"/"italia"/"do italii"
    # etc. but not mid-word after a letter.
    match: ["włoch", "wloch", "(?<![A-Za-z])ital", "итали"]

  - name: PL-LV   # Latvia
    match: ["łotw", "lotw", "latvia"]

  - name: PL-LT   # Lithuania
    match: ["litw", "lithuania"]

  - name: PL-LU   # Luxembourg
    match: ["luksemburg", "luxembourg"]

  - name: PL-PT   # Portugal
    match: ["portugal"]

  - name: PL-RO   # Romania
    match: ["rumuni", "romania"]

  - name: PL-SK   # Slovakia
    match: ["słowacj", "slowacj", "slovakia"]

  - name: PL-SI   # Slovenia
    match: ["słoweni", "sloweni", "slovenia"]

  - name: PL-HU   # Hungary
    match: ["węgr", "wegr", "hungary"]

  - name: PL-FI   # Finland
    match: ["finlandi", "finland"]

  - name: PL-FR   # France
    match: ["francj", "france"]

  - name: PL-HR   # Croatia
    match: ["chorwacj", "croatia"]

  - name: PL-CZ   # Czech Republic
    # 2026-09-21: replaced the original two-pattern fix ("czechy" bare +
    # a boundary-anchored "czech") with a single more-robust pattern.
    # (?<![a-ząćęłńóśźż])czech (case-insensitive, so this also covers the
    # uppercase range) blocks the "Niemczech" collision (locative of
    # "Niemcy" = Germany - the "m" right before "czech" there is a letter,
    # so the lookbehind fails) while still matching both "Czechy"
    # (nominative plural - nothing blocks the trailing "y") and "do Czech"
    # (genitive - preceded by a space) with one pattern instead of two.
    # Unlike the old (?<![A-Za-z]) version, this lookbehind's character
    # class also excludes Polish diacritics, not just ASCII letters - the
    # old version would have silently let a diacritic count as "not a
    # letter" and risked a false match right after one (the same class of
    # bug found independently elsewhere in this account's campaign-name
    # patterns). "czesk" adds the adjective forms (czeski/czeska/czeskie).
    # "чехи"/"чех[иі]ю"/"чешск" are Russian, all found live.
    match: ["(?<![a-ząćęłńóśźż])czech", "czesk", "czech republic", "republika czeska", "чехи", "чех[иі]ю", "чешск"]

  - name: PL-SE   # Sweden
    match: ["szwecj", "sweden"]

  - name: PL-CA   # Canada
    match: ["kanad", "canada"]

  - name: PL-NL   # Netherlands
    match: ["holandi", "niderland", "netherlands"]

# Used for search-term-level brand detection (content matching),
# independent of which campaign the term currently lives in —
# feeds the pattern-seeking / re-homing suggestion stage.
brand_keywords:
  - meest
  - міст
  - мист
  - mist
  - меест
